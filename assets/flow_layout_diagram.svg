<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" style="background:#0a0c10; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="460" y="38" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">SwiftUI FlowLayout Architecture</text>
  <text x="460" y="62" text-anchor="middle" fill="#94a3b8" font-size="13">Declarative multi-line wrapping container with dynamic alignment modes and iOS 15 / UIKit backports</text>

  <!-- Module 1: SwiftUI Layout Protocol -->
  <g transform="translate(40, 95)" filter="url(#cardGlow)">
    <rect width="250" height="280" rx="14" fill="#131722" stroke="#2d3748" stroke-width="1.5" />
    <rect width="250" height="38" rx="14" fill="url(#blueGrad)" />
    <rect y="26" width="250" height="12" fill="url(#blueGrad)" />
    <text x="125" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">SwiftUI Layout Engine</text>

    <rect x="18" y="55" width="214" height="42" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="28" y="74" fill="#38bdf8" font-size="12" font-weight="600">FlowLayout: Layout</text>
    <text x="28" y="89" fill="#94a3b8" font-size="10">Modern iOS 16+ protocol API</text>

    <rect x="18" y="107" width="214" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="28" y="126" fill="#f8fafc" font-size="12" font-weight="600">sizeThatFits(proposal:)</text>
    <text x="28" y="142" fill="#94a3b8" font-size="10">Dynamic width/height constraint</text>

    <rect x="18" y="163" width="214" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="28" y="182" fill="#f8fafc" font-size="12" font-weight="600">placeSubviews(in:)</text>
    <text x="28" y="198" fill="#94a3b8" font-size="10">Precise subview coordinate mapping</text>

    <rect x="18" y="219" width="214" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="28" y="238" fill="#f8fafc" font-size="12" font-weight="600">Adaptive Re-rendering</text>
    <text x="28" y="254" fill="#94a3b8" font-size="10">Zero jitter during container resize</text>
  </g>

  <!-- Module 2: Pure Flow Calculator -->
  <g transform="translate(335, 95)" filter="url(#cardGlow)">
    <rect width="250" height="280" rx="14" fill="#131722" stroke="#2d3748" stroke-width="1.5" />
    <rect width="250" height="38" rx="14" fill="url(#purpleGrad)" />
    <rect y="26" width="250" height="12" fill="url(#purpleGrad)" />
    <text x="125" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">FlowCalculator (Math)</text>

    <rect x="18" y="55" width="214" height="42" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="28" y="74" fill="#c084fc" font-size="12" font-weight="600">calculateLayout(sizes:)</text>
    <text x="28" y="89" fill="#94a3b8" font-size="10">Pure mathematical row clusterer</text>

    <rect x="18" y="107" width="214" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="28" y="126" fill="#f8fafc" font-size="12" font-weight="600">Alignment Modalities</text>
    <text x="28" y="142" fill="#94a3b8" font-size="10">leading, center, trailing, justified</text>

    <rect x="18" y="163" width="214" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="28" y="182" fill="#f8fafc" font-size="12" font-weight="600">Vertical Alignment</text>
    <text x="28" y="198" fill="#94a3b8" font-size="10">top, center, bottom for mixed heights</text>

    <rect x="18" y="219" width="214" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="28" y="238" fill="#f8fafc" font-size="12" font-weight="600">Spacing Matrix</text>
    <text x="28" y="254" fill="#94a3b8" font-size="10">Independent horizontal & vertical gaps</text>
  </g>

  <!-- Module 3: Universal Backports -->
  <g transform="translate(630, 95)" filter="url(#cardGlow)">
    <rect width="250" height="280" rx="14" fill="#131722" stroke="#2d3748" stroke-width="1.5" />
    <rect width="250" height="38" rx="14" fill="url(#emeraldGrad)" />
    <rect y="26" width="250" height="12" fill="url(#emeraldGrad)" />
    <text x="125" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">Cross-Platform Backports</text>

    <rect x="18" y="55" width="214" height="42" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="28" y="74" fill="#34d399" font-size="12" font-weight="600">FlowCollection (iOS 15)</text>
    <text x="28" y="89" fill="#94a3b8" font-size="10">AlignmentGuide preference backport</text>

    <rect x="18" y="107" width="214" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="28" y="126" fill="#f8fafc" font-size="12" font-weight="600">UIKit LeftAligned Layout</text>
    <text x="28" y="142" fill="#94a3b8" font-size="10">UICollectionViewFlowLayout subclass</text>

    <rect x="18" y="163" width="214" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="28" y="182" fill="#f8fafc" font-size="12" font-weight="600">macOS Desktop Ready</text>
    <text x="28" y="198" fill="#94a3b8" font-size="10">Tags, chips, and token filters</text>

    <rect x="18" y="219" width="214" height="46" rx="8" fill="#1e2433" stroke="#334155" stroke-width="1" />
    <text x="28" y="238" fill="#f8fafc" font-size="12" font-weight="600">Zero Dependencies</text>
    <text x="28" y="254" fill="#94a3b8" font-size="10">Native CoreGraphics & SwiftUI</text>
  </g>

  <!-- Connectors -->
  <path d="M 290 235 L 335 235" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="335,235 327,230 327,240" fill="#3b82f6" />

  <path d="M 585 235 L 630 235" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="630,235 622,230 622,240" fill="#10b981" />

  <!-- Bottom Badges -->
  <g transform="translate(195, 392)">
    <rect width="120" height="22" rx="6" fill="#1e293b" />
    <text x="60" y="15" text-anchor="middle" fill="#94a3b8" font-size="11">iOS 15+ / macOS 12+</text>
  </g>
  <g transform="translate(330, 392)">
    <rect width="130" height="22" rx="6" fill="#1e293b" />
    <text x="65" y="15" text-anchor="middle" fill="#94a3b8" font-size="11">Swift 5.9 & Swift 6</text>
  </g>
  <g transform="translate(475, 392)">
    <rect width="115" height="22" rx="6" fill="#1e293b" />
    <text x="57" y="15" text-anchor="middle" fill="#94a3b8" font-size="11">SwiftUI Layout API</text>
  </g>
  <g transform="translate(605, 392)">
    <rect width="110" height="22" rx="6" fill="#1e293b" />
    <text x="55" y="15" text-anchor="middle" fill="#94a3b8" font-size="11">100% Test Coverage</text>
  </g>
</svg>
